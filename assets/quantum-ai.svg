<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">Quantum AI — OpenUSA</title>
<desc id="desc">Animated Bloch sphere, quantum interference, and neural network visualizing quantum–classical computing.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#060c19"/><stop offset=".52" stop-color="#0a1230"/><stop offset="1" stop-color="#0c0c23"/></linearGradient>
 <radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop stop-color="#4d74ee" stop-opacity=".3"/><stop offset=".55" stop-color="#3a57ad" stop-opacity=".08"/><stop offset="1" stop-color="#243d7f" stop-opacity="0"/></radialGradient>
 <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#52e6f5"/><stop offset=".52" stop-color="#758dff"/><stop offset="1" stop-color="#c299ff"/></linearGradient>
