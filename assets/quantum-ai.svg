<style>
 .orbit{transform-box:fill-box;transform-origin:center;animation:revolve 18s linear infinite}
 .orbit2{transform-box:fill-box;transform-origin:center;animation:revolve 25s linear infinite reverse}
 .pulse{animation:pulse 3.2s ease-in-out infinite}
 .trace{stroke-dasharray:12 19;animation:trace 3s linear infinite}
 .shimmer{animation:shimmer 5s ease-in-out infinite}
 .wave{animation:shimmer 4s ease-in-out infinite}
 @keyframes revolve{to{transform:rotate(360deg)}}
 @keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}
 @keyframes trace{to{stroke-dashoffset:-62}}
 @keyframes shimmer{0%,100%{opacity:.45}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse,.trace,.shimmer,.wave{animation:none}}
</style>
