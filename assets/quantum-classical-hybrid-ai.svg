<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 590" width="1320" height="590" role="img" aria-label="Quantum–Classical Hybrid AI: animated neural encoding, quantum circuit, measurement, classical prediction, gradient updates">
<defs>
<pattern id="dotgrid" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#cad9e2" opacity=".65"/></pattern>
<linearGradient id="feed" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bc7655"/><stop offset=".5" stop-color="#cf8e6b"/><stop offset="1" stop-color="#bc7655"/></linearGradient>
<style>
.signal{fill:none;stroke:#4679b4;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:7 22;animation:forward 5.6s linear infinite}
.qsignal{fill:none;stroke:#079688;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:9 34;animation:forward 5.6s linear infinite}
.gradient{fill:none;stroke:url(#feed);stroke-width:2;stroke-linecap:round;stroke-dasharray:9 37;animation:backward 5.6s linear infinite,backPhase 5.6s linear infinite}
.nnode{animation:glow 5.6s ease-in-out infinite}
.gate{animation:gate 5.6s ease-in-out infinite}
.readout{transform-box:fill-box;transform-origin:left center;animation:measure 5.6s ease-in-out infinite}
@keyframes forward{from{stroke-dashoffset:180}to{stroke-dashoffset:0}}
@keyframes backward{from{stroke-dashoffset:0}to{stroke-dashoffset:184}}
@keyframes backPhase{0%,63%,100%{opacity:0}70%,94%{opacity:1}}
@keyframes glow{0%,7%,95%,100%{opacity:.55}24%,43%{opacity:1}66%{opacity:.7}}
@keyframes gate{0%,21%,100%{opacity:.64}38%,58%{opacity:1}}
@keyframes measure{0%,36%,100%{transform:scaleX(.42);opacity:.7}61%,76%{transform:scaleX(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.signal,.qsignal,.gradient,.nnode,.gate,.readout{animation:none!important}}
</style>
</defs>
